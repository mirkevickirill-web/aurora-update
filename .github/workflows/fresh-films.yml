name: Свежие подборки фильмов

on:
  schedule:
    - cron: '17 2 * * 1'   # каждый понедельник в 05:17 по Минску
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Собрать новинки, рейтинги, постеры и трейлеры
        run: python3 scripts/fresh.py
      - name: Сохранить films.json
        run: |
          git config user.name "aurora-bot"
          git config user.email "aurora-bot@users.noreply.github.com"
          git add films.json
          git diff --cached --quiet && echo "без изменений" && exit 0
          git commit -m "Свежие подборки $(date +%F)"
          git push
